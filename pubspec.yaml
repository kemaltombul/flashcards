name: english_flashcards
description: "True Vocab"
publish_to: 'none'

version: 1.2.0+1
environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1


  # Utilities
  path_provider: ^2.1.5
  file_picker: ^10.3.6
  share_plus: ^12.0.1
  introduction_screen: ^4.0.0
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  shared_preferences: ^2.2.2
  http: ^1.6.0
  dart_openai: ^6.0.0
  flutter_dotenv: ^6.0.0
  image_picker: ^1.2.1
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/initial_data.json
    - .env